id: 8f2b1c40-1111-4a01-9c01-password-spray-0001
name: Password spray against Entra ID
description: |
  Many accounts, few passwords, short window. Detects a low-and-slow spray by
  grouping failures per source IP and counting DISTINCT accounts rather than
  total failures — a single account failing 50 times is a user with a stale
  password, not an attacker.
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110
  - T1110.003
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIP
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: TargetedAccounts
query: |
  let threshold = 10;
  let window = 1h;
  SigninLogs
  | where TimeGenerated > ago(window)
  | where ResultType in ("50126", "50053", "50055", "50056", "50057")   // invalid credentials / locked
  | summarize
      FailedAttempts = count(),
      DistinctAccounts = dcount(UserPrincipalName),
      TargetedAccounts = make_set(UserPrincipalName, 10),
      Apps = make_set(AppDisplayName, 5)
    by SourceIP = tostring(IPAddress), bin(TimeGenerated, 15m)
  | where DistinctAccounts >= threshold
  // A spray targets many accounts from one IP. One account from many IPs is
  // handled by the impossible-travel rule instead.
  | extend Ratio = round(todouble(FailedAttempts) / DistinctAccounts, 1)
  | where Ratio < 5
  | project TimeGenerated, SourceIP, FailedAttempts, DistinctAccounts, Ratio, TargetedAccounts, Apps
tuning:
  rationale: |
    The `Ratio < 5` condition is what separates a spray from a single-account
    brute force. Without it, the rule fires on a user with a cached old password
    on three devices.
  falsePositives:
    - "A corporate NAT egress IP where several users forgot their password after a holiday"
    - "A misconfigured service principal retrying with an expired secret across accounts"
  thresholdHistory:
    - date: 2025-09-14
      change: "DistinctAccounts 5 -> 10"
      reason: "NAT egress at the Bengaluru office produced 6-8 accounts in 15m twice a week"
  containment: notify-only
